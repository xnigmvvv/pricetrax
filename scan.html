<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PriceTrax</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;min-height:100vh;}
  body{background:#0f0f0f;font-family:Impact,"Arial Narrow",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:6vw;}

  .brand{font-size:3vw;letter-spacing:4px;color:#444;text-transform:uppercase;margin-bottom:8vw;}
  .brand span{color:#cc0000;}

  /* PIN SCREEN */
  #pin-screen{width:100%;text-align:center;}
  .pin-name{font-size:7vw;color:#ffffff;line-height:1.2;margin-bottom:8vw;word-break:break-word;}
  .pin-label{font-size:3.5vw;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:5vw;}
  .pin-dots{display:flex;justify-content:center;gap:4vw;margin-bottom:8vw;}
  .pin-dot{width:5vw;height:5vw;border-radius:50%;background:#222;border:2px solid #444;}
  .pin-error{font-size:3.5vw;color:#cc0000;letter-spacing:2px;text-transform:uppercase;min-height:5vw;margin-bottom:4vw;}
  .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3vw;max-width:72vw;margin:0 auto;}
  .pin-btn{background:#1a1a1a;border:1px solid #333;color:#fff;font-size:8vw;font-family:Impact,"Arial Narrow",sans-serif;padding:4vw;border-radius:2vw;cursor:pointer;transition:none;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;}
  .pin-btn:active{background:#cc0000;}
  .pin-zero{grid-column:2;}
  .pin-del{background:#1a1a1a;border:1px solid #333;color:#cc0000;font-size:6vw;padding:4vw;border-radius:2vw;cursor:pointer;transition:none;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation;}

  /* PRICE SCREEN */
  #price-screen{width:100%;text-align:center;display:none;}
  .price-name{font-size:9vw;color:#ffffff;line-height:1.2;margin-bottom:6vw;word-break:break-word;}
  hr{border:none;border-top:2px solid #cc0000;width:20vw;margin:0 auto 6vw;}
  .price-lbl{font-size:3vw;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:2vw;}
  .price{font-size:28vw;color:#cc0000;line-height:1;letter-spacing:-1vw;margin-bottom:6vw;}
  .price sup{font-size:12vw;vertical-align:super;letter-spacing:0;}
  .price-date{font-size:3vw;color:#444;font-family:"Courier New",monospace;letter-spacing:1px;}

  /* SOLD */
  .sold-area{margin-top:8vw;text-align:center;}
  .btn-mark-sold{background:#27ae60;border:none;color:#fff;font-family:Impact,"Arial Narrow",sans-serif;font-size:5.5vw;letter-spacing:3px;padding:4vw 0;border-radius:2vw;cursor:pointer;width:72vw;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .btn-mark-sold:active{background:#219a52;}
  .btn-mark-sold.is-sold{background:#333;color:#666;cursor:default;}
  .sold-input-area{margin-top:5vw;display:none;}
  .sold-input{width:72vw;background:#1a1a1a;border:2px solid #27ae60;color:#fff;font-family:Impact,"Arial Narrow",sans-serif;font-size:10vw;text-align:center;padding:3vw;border-radius:2vw;display:block;margin:0 auto 3vw;}
  .btn-confirm-sold{background:#cc0000;border:none;color:#fff;font-family:Impact,"Arial Narrow",sans-serif;font-size:5vw;letter-spacing:3px;padding:3.5vw 0;border-radius:2vw;cursor:pointer;width:72vw;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .btn-confirm-sold:active{background:#a00;}
  .sold-status{margin-top:4vw;font-size:4.5vw;color:#27ae60;letter-spacing:2px;min-height:6vw;}
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div class="brand">PRICE<span>TRAX</span> &mdash; BADGER BREAKS</div>
  <div class="pin-name" id="card-name"></div>
  <div class="pin-label">Enter Staff PIN</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-error" id="pin-error"></div>
  <div class="pin-grid">
    <button class="pin-btn" id="b1">1</button>
    <button class="pin-btn" id="b2">2</button>
    <button class="pin-btn" id="b3">3</button>
    <button class="pin-btn" id="b4">4</button>
    <button class="pin-btn" id="b5">5</button>
    <button class="pin-btn" id="b6">6</button>
    <button class="pin-btn" id="b7">7</button>
    <button class="pin-btn" id="b8">8</button>
    <button class="pin-btn" id="b9">9</button>
    <button class="pin-del pin-zero" id="bdel">&#9003;</button>
    <button class="pin-btn" id="b0">0</button>
  </div>
</div>

<!-- PRICE SCREEN -->
<div id="price-screen">
  <div class="brand">PRICE<span>TRAX</span> &mdash; BADGER BREAKS</div>
  <div class="price-name" id="price-name"></div>
  <hr>
  <div class="price-lbl">Purchase Price</div>
  <div class="price" id="price-display"></div>
  <div class="price-date" id="price-date"></div>
  <div class="sold-area">
    <button class="btn-mark-sold" id="btn-sold">MARK AS SOLD</button>
    <div class="sold-input-area" id="sold-input-area">
      <input class="sold-input" type="number" id="sold-price" placeholder="0.00" step="0.01" min="0">
      <button class="btn-confirm-sold" id="btn-confirm-sold">CONFIRM SALE</button>
    </div>
    <div class="sold-status" id="sold-status"></div>
  </div>
</div>

<script>
  // ── Config ──────────────────────────────
  var PIN = "2323";
  // ────────────────────────────────────────

  var SHEET_URL = "https://script.google.com/macros/s/AKfycbw6JGbSkulzpVUimDUCV_oDjCFDpqiJo8chmJgUI06ne0qmr7z0Vir35lbfJI4ua2RZLg/exec";

  // Parse URL params
  var params = new URLSearchParams(window.location.search);
  var name  = params.get("n") || "Unknown Card";
  var date  = params.get("t") || "";
  var uid   = params.get("uid") || "";
  var encodedPrice = params.get("p") || "";

  // Decode price after PIN — same XOR key
  function decodePrice(encoded, key) {
    try {
      var decoded = atob(encoded);
      var result = "";
      for (var i = 0; i < decoded.length; i++) {
        result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return parseFloat(result).toFixed(2);
    } catch(e) {
      return "0.00";
    }
  }

  var price = ""; // decoded after PIN

  // Populate card name on PIN screen
  document.getElementById("card-name").textContent = name;

  // PIN logic
  var entered = "";
  var dotEls = [
    document.getElementById("d0"),
    document.getElementById("d1"),
    document.getElementById("d2"),
    document.getElementById("d3")
  ];

  function enterDigit(digit) {
    if (entered.length >= 4) return;
    entered += digit;
    dotEls[entered.length - 1].style.background = "#cc0000";
    dotEls[entered.length - 1].style.borderColor = "#cc0000";
    if (entered.length === 4) {
      if (entered === PIN) {
        // Decode price now that PIN is confirmed
        price = decodePrice(encodedPrice, PIN);
        // Show price instantly — no server call
        document.getElementById("price-name").textContent = name;
        document.getElementById("price-display").innerHTML = "<sup>$</sup>" + price;
        document.getElementById("price-date").textContent = date ? "Purchased " + date : "";
        document.getElementById("pin-screen").style.display = "none";
        document.getElementById("price-screen").style.display = "block";
      } else {
        document.getElementById("pin-error").textContent = "Incorrect PIN";
        setTimeout(function() {
          entered = "";
          dotEls.forEach(function(dot) {
            dot.style.background = "#222";
            dot.style.borderColor = "#444";
          });
          document.getElementById("pin-error").textContent = "";
        }, 600);
      }
    }
  }

  function deleteDigit() {
    if (entered.length === 0) return;
    entered = entered.slice(0, -1);
    dotEls[entered.length].style.background = "#222";
    dotEls[entered.length].style.borderColor = "#444";
    document.getElementById("pin-error").textContent = "";
  }

  // Attach touch listeners — preventDefault kills the 300ms iOS click delay
  function attachBtn(id, fn) {
    var el = document.getElementById(id);
    el.addEventListener('touchend', function(e) {
      e.preventDefault();
      fn();
    }, { passive: false });
    el.addEventListener('click', fn);
  }

  attachBtn('b1', function(){ enterDigit('1'); });
  attachBtn('b2', function(){ enterDigit('2'); });
  attachBtn('b3', function(){ enterDigit('3'); });
  attachBtn('b4', function(){ enterDigit('4'); });
  attachBtn('b5', function(){ enterDigit('5'); });
  attachBtn('b6', function(){ enterDigit('6'); });
  attachBtn('b7', function(){ enterDigit('7'); });
  attachBtn('b8', function(){ enterDigit('8'); });
  attachBtn('b9', function(){ enterDigit('9'); });
  attachBtn('b0', function(){ enterDigit('0'); });
  attachBtn('bdel', deleteDigit);

  // ── MARK SOLD ──
  var soldDone = false;

  document.getElementById("btn-sold").addEventListener("touchend", function(e) {
    e.preventDefault(); toggleSoldInput();
  }, { passive: false });
  document.getElementById("btn-sold").addEventListener("click", toggleSoldInput);

  document.getElementById("btn-confirm-sold").addEventListener("touchend", function(e) {
    e.preventDefault(); confirmSold();
  }, { passive: false });
  document.getElementById("btn-confirm-sold").addEventListener("click", confirmSold);

  function toggleSoldInput() {
    if (soldDone) return;
    var area = document.getElementById("sold-input-area");
    area.style.display = area.style.display === "block" ? "none" : "block";
    if (area.style.display === "block") document.getElementById("sold-price").focus();
  }

  function confirmSold() {
    if (soldDone) return;
    var val = parseFloat(document.getElementById("sold-price").value);
    if (isNaN(val) || val < 0) {
      document.getElementById("sold-status").textContent = "ENTER A VALID PRICE";
      document.getElementById("sold-status").style.color = "#cc0000";
      return;
    }
    var url = SHEET_URL + "?action=sold&n=" + encodeURIComponent(name) + "&t=" + encodeURIComponent(date) + "&s=" + encodeURIComponent(val.toFixed(2)) + "&uid=" + encodeURIComponent(uid);
    fetch(url, { mode: "no-cors" }).catch(function(){});
    soldDone = true;
    document.getElementById("sold-input-area").style.display = "none";
    var btn = document.getElementById("btn-sold");
    btn.textContent = "SOLD — $" + val.toFixed(2);
    btn.classList.add("is-sold");
    document.getElementById("sold-status").textContent = "✓ LOGGED";
    document.getElementById("sold-status").style.color = "#27ae60";
  }
</script>
</body>
</html>
